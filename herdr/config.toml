onboarding = false
# ~/.config/herdr/config.toml へ mkOutOfStoreSymlink で symlink (編集即反映、drs 不要)。
# リロードは prefix+shift+r または `herdr server reload-config`。

[keys]
prefix = "ctrl+s"
zoom = ["prefix+z", "prefix+m"]
split_vertical = ["prefix+v", "prefix+backslash"]
detach = ["prefix+q", "prefix+d"]
navigate_workspace_up = "k"
navigate_workspace_down = "j"
# mac は WezTerm 側で cmd+ctrl+[ / ] を "\x13{" / "\x13}" (prefix + キー) として送出、
# Windows は cmd キーが無いので alt+ctrl+[ / ] を herdr 側で直接バインドする
previous_workspace = ["prefix+{", "alt+ctrl+["]
next_workspace = ["prefix+}", "alt+ctrl+]"]

[ui]
show_agent_labels_on_pane_borders = false
agent_panel_sort = "priority"
toast.delivery = "system"

[session]
resume_agents_on_restore = true
