#:schema https://raw.githubusercontent.com/openai/codex/main/codex-rs/core/config.schema.json
# Codex の共通設定。/etc/codex/config.toml (system レイヤー) として全クライアントに読まれる。
# ~/.codex/config.toml (user レイヤー) は Codex 自身が書く可変状態 (project trust / [notice] / /model の選択 /
# notify / [mcp_servers.*]) 用に明け渡すので、dotfiles では管理しない。user レイヤーの同名キーはこのファイルより優先される。

approval_policy = "never"
sandbox_mode = "danger-full-access"

notify = ["terminal-notifier", "-message", "codex task done", "-sound", "default"]
model = "gpt-6-astra"
model_reasoning_effort = "high"
personality = "pragmatic"
service_tier = "default"
plan_mode_reasoning_effort = "high"
web_search = "live"
suppress_unstable_features_warning = true

[features]
memories = true
default_mode_request_user_input = true

[features.context_management]
experimental_mode = true

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp_servers.chrome-devtools]
command = "npx"
args = ["chrome-devtools-mcp@latest"]

# コミット規約ゲート。Claude Code の settings.json と同じ hook スクリプトを共有する。
# system レイヤー (/etc/codex/config.toml) に置いた hooks は信頼ゲート (/hooks での承認) を
# 通らずに発火する (user レイヤーの ~/.codex/hooks.json は承認するまで無言でスキップされる)。
# command 文字列はシェル経由で解釈されるので $GHQ_ROOT が展開でき、mac と Linux で同じ記述が使える。
[[hooks.PreToolUse]]
matcher = "Bash"
[[hooks.PreToolUse.hooks]]
type = "command"
command = "deno run --allow-env --allow-read $GHQ_ROOT/github.com/skanehira/dotfiles/agents/hooks/commit-msg-guard.ts"
timeout = 20
