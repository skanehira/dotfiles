#:schema https://raw.githubusercontent.com/openai/codex/main/codex-rs/core/config.schema.json
# Codex の共通設定。/etc/codex/config.toml (system レイヤー) として全クライアントに読まれる。
# ~/.codex/config.toml (user レイヤー) は Codex 自身が書く可変状態 (project trust / [notice] / /model の選択 /
# notify) 用に明け渡すので、dotfiles では管理しない。user レイヤーの同名キーはこのファイルより優先される。
# [mcp_servers.*] は両レイヤーに現れる。全マシン共通のサーバはここで配り、マシン固有のものは user レイヤーに任せる。

approval_policy = "never"
sandbox_mode = "danger-full-access"

notify = ["terminal-notifier", "-message", "codex task done", "-sound", "default"]
model = "gpt-6-astra"
model_reasoning_effort = "high"
personality = "pragmatic"
service_tier = "default"
plan_mode_reasoning_effort = "high"
web_search = "live"
suppress_unstable_features_warning = true

[features]
memories = true
default_mode_request_user_input = true

[features.context_management]
experimental_mode = true

[tui]
status_line = ["model-with-reasoning", "git-branch", "weekly-limit", "five-hour-limit", "context-remaining"]
status_line_use_colors = true
session_picker_view = "comfortable"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp_servers.chrome-devtools]
command = "npx"
args = ["chrome-devtools-mcp@latest"]

# hooks はこのファイルには無い。このハーネスは機械ゲートを 1 本も持たないので、
# 移植すべきものが無い (Claude Code 向けにも無い)。
# 追加するときは必ずこのファイル (system レイヤー) に書く。~/.codex/hooks.json (user レイヤー)
# に置いたものは /hooks で承認するまで無言でスキップされ、警告も出ない。
